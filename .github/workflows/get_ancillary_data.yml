name: Get ancillary data

# Wave 2 of a dataset version (after 'Get ERA5-Land data', before 'Process tiles to parquets'):
# the eight static ancillary layers of every tile (Copernicus DEM, CHILI from Earth Engine, snow
# class, WorldCover, forest cover, GMBA / HydroBASINS level-6 / continent ids), resampled onto
# the tile's window of the DATASET grid and committed to ONE icechunk repository per grid
# generation (pipeline/scripts/build_ancillary_batch.py; layout in gsro_analysis/datacube.py).
# The plan job creates the repository if it does not exist, folds its commit history and lists
# the tiles without a commit; each matrix job builds one batch, one commit per tile. Failure =
# no commit = re-listed next dispatch; re-dispatch until the plan job reports 0 remaining.
# `start_fresh` (off by default) DELETES the version's ancillary repository first: the only
# deletion this workflow can make. Runs on the GitHub-hosted runners of this public repository
# with the repository secrets AZURE_STORAGE_SAS_TOKEN, AZURE_STORAGE_ACCOUNT and
# EE_SERVICE_ACCOUNT_KEY; the production repo is checked out at a pinned commit.

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Tiles per matrix job (~2.5 min per tile)'
        required: false
        default: '36'
        type: string
      config_file:
        description: 'Config file (resolved inside the production clone)'
        required: false
        default: 'config/global_config_v10.txt'
        type: string
      start_fresh:
        description: 'DELETE this version''s ancillary repository first, then rebuild every tile (Earth Engine again)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: ancillary-${{ inputs.config_file }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # the production package (Config, store access, provenance) is pinned to a commit, never a
  # branch: that repository is read-only from here. Mirrored in the pixi.toml comment.
  PRODUCTION_REPO_SHA: 18992fa7018d517a23f5507b28ec80edba2d0482
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # a start_fresh reset deletes the whole repository
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: global_snowmelt_runoff_onset_analysis

      - name: Checkout production repo (side-by-side, required by the pixi env and Config; pinned commit)
        uses: actions/checkout@v4
        with:
          repository: egagli/global_snowmelt_runoff_onset
          ref: ${{ env.PRODUCTION_REPO_SHA }}
          path: global_snowmelt_runoff_onset

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.65.0
          manifest-path: global_snowmelt_runoff_onset_analysis/pixi.toml
          environments: ci
          cache: true

      - name: Restore vector-source cache (continents, for the template attrs)
        uses: actions/cache@v4
        with:
          path: global_snowmelt_runoff_onset_analysis/data/geometries/sources
          key: vector-sources-v1

      - name: Create the ancillary repository if missing, fold its ledger, list the tiles without a commit
        id: plan
        working-directory: global_snowmelt_runoff_onset_analysis
        run: |
          pixi run -e ci python pipeline/scripts/get_remaining_work.py --stage ancillary \
            --config "${{ inputs.config_file }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --manifest-out "$GITHUB_WORKSPACE/fleet_manifest.json" \
            ${{ inputs.start_fresh && '--start-fresh' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ancillary-manifest
          path: fleet_manifest.json

  build:
    needs: plan
    if: fromJson(needs.plan.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false        # one bad tile must not kill the wave
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      MALLOC_ARENA_MAX: "2"   # cap glibc arena creep on long multi-tile jobs
    steps:
      - uses: actions/checkout@v4
        with:
          path: global_snowmelt_runoff_onset_analysis

      - name: Checkout production repo (side-by-side, required by the pixi env and Config; pinned commit)
        uses: actions/checkout@v4
        with:
          repository: egagli/global_snowmelt_runoff_onset
          ref: ${{ env.PRODUCTION_REPO_SHA }}
          path: global_snowmelt_runoff_onset

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.65.0
          manifest-path: global_snowmelt_runoff_onset_analysis/pixi.toml
          environments: ci
          cache: true

      - name: Restore vector-source cache (GMBA / continents / BasinATLAS)
        uses: actions/cache@v4
        with:
          path: global_snowmelt_runoff_onset_analysis/data/geometries/sources
          key: vector-sources-v1

      - name: Write Earth Engine service key
        run: |
          printf '%s' "$EE_KEY" > global_snowmelt_runoff_onset/config/ee_key.json
        env:
          EE_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}

      - uses: actions/download-artifact@v4
        with:
          name: ancillary-manifest

      - name: Build batch ${{ matrix.batch_index }}
        working-directory: global_snowmelt_runoff_onset_analysis
        run: |
          pixi run -e ci python pipeline/scripts/build_ancillary_batch.py \
            --config "${{ inputs.config_file }}" \
            --manifest "$GITHUB_WORKSPACE/fleet_manifest.json" \
            --batch ${{ matrix.batch_index }}
