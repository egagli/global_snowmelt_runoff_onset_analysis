name: CI

# Smoke test without secrets: the ci environment solves, the package imports, and the three
# aggregation notebooks run headlessly on two tracked fixture tiles (tests/README.md) — the
# reduce, the unit names, the per-unit metrics tables. The steps that need the Azure SAS token
# (partials download, ERA5-Land zonal means) skip themselves when no token is present. Runs on
# every push and pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # the production package is pinned to a commit, never a branch (the repository is read-only from here)
  PRODUCTION_REPO_SHA: 18992fa7018d517a23f5507b28ec80edba2d0482

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: global_snowmelt_runoff_onset_analysis

      - name: Checkout production repo (side-by-side, required by the pixi env and Config)
        uses: actions/checkout@v4
        with:
          repository: egagli/global_snowmelt_runoff_onset
          ref: ${{ env.PRODUCTION_REPO_SHA }}
          path: global_snowmelt_runoff_onset

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.65.0
          manifest-path: global_snowmelt_runoff_onset_analysis/pixi.toml
          environments: ci
          cache: true

      - name: Restore the BasinATLAS gdb (2.7 GB, downloaded once per cache key; the level-5 basin polygons of the basin metrics table)
        uses: actions/cache@v4
        with:
          path: global_snowmelt_runoff_onset_analysis/analyses/river_basins/data/geometries/BasinATLAS_Data_v10.gdb.zip
          key: basinatlas-v10-gdb

      - name: Import the package
        working-directory: global_snowmelt_runoff_onset_analysis
        run: pixi run -e ci python -c "import gsro_analysis.aggregate, gsro_analysis.datacube, gsro_analysis.era5; print('ok')"

      - name: Run the three aggregation notebooks on the fixture partials (no credentials)
        working-directory: global_snowmelt_runoff_onset_analysis
        env:
          GSRO_PARTIALS_ROOT: ${{ github.workspace }}/global_snowmelt_runoff_onset_analysis/tests/fixtures/partials
          GSRO_OUTPUT_ROOT: ${{ runner.temp }}/analyses
        run: |
          for nb in analyses/continents/0_aggregate_by_continent.ipynb \
                    analyses/mountain_ranges/0_aggregate_by_mountain_range.ipynb \
                    analyses/river_basins/0_aggregate_by_river_basin.ipynb; do
            echo "::group::$nb"
            pixi run -e ci jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=3000 --ExecutePreprocessor.kernel_name=python3 \
              --output-dir "$RUNNER_TEMP/executed" "$nb"
            echo "::endgroup::"
          done
          test -s "$RUNNER_TEMP/analyses/continents/data/aggregation/v10/all_continents_fcf_lte_50.nc"
          test -s "$RUNNER_TEMP/analyses/continents/data/aggregation/v10/all_continents_full_dataset.nc"
          test -s "$RUNNER_TEMP/analyses/mountain_ranges/data/aggregation/v10/all_mountain_ranges_fcf_lte_50.nc"
          test -s "$RUNNER_TEMP/analyses/mountain_ranges/results/v10/mountain_range_metrics.csv"
          test -s "$RUNNER_TEMP/analyses/river_basins/data/aggregation/v10/all_river_basins_fcf_lte_50.nc"
          test -s "$RUNNER_TEMP/analyses/river_basins/results/v10/river_basin_metrics.csv"
