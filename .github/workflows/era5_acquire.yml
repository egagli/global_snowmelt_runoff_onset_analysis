name: ERA5 Acquire

# Fetch ERA5-Land water-year stores (pipeline/scripts/fetch_era5.py) on a
# 16 GB runner — the fetch OOMs on the dev box. One matrix job per water
# year; each is skip-if-exists, so redispatching is free. Runs on the
# GitHub-hosted runners of this public repository (the 16 GB machines this
# job needs) with the same three repository secrets as the fleet.

on:
  workflow_dispatch:
    inputs:
      water_years:
        description: 'Comma-separated water years to fetch (each becomes one job)'
        required: false
        default: '2025'
        type: string
      copy_from_version:
        description: 'First server-side copy this version''s existing year stores (e.g. v9); blank = no copy'
        required: false
        default: ''
        type: string
      config_file:
        description: 'Config file (resolved inside the production clone)'
        required: false
        default: 'config/global_config_v10.txt'
        type: string
      build_anomaly:
        description: 'After the year stores, build the anomaly store (all years as base period; ~4 GB)'
        required: false
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: era5-${{ inputs.config_file }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # keep stdout/stderr interleaved in job logs
  # the production package (Config, store access, plot_utils) is pinned to a commit, never a
  # branch: that repository is read-only from here. Mirrored in the pixi.toml comment.
  PRODUCTION_REPO_SHA: 18992fa7018d517a23f5507b28ec80edba2d0482
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}

jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - id: split
        run: |
          YEARS=$(echo "${{ inputs.water_years }}" | python3 -c "import sys,json; print(json.dumps([y.strip() for y in sys.stdin.read().split(',') if y.strip()]))")
          echo "matrix={\"year\":$YEARS}" >> "$GITHUB_OUTPUT"

  fetch:
    needs: years
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.years.outputs.matrix) }}
    env:
      MALLOC_ARENA_MAX: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: global_snowmelt_runoff_onset_analysis

      - name: Checkout production repo (side-by-side, required by the pixi env and Config; pinned commit)
        uses: actions/checkout@v4
        with:
          repository: egagli/global_snowmelt_runoff_onset
          ref: ${{ env.PRODUCTION_REPO_SHA }}
          path: global_snowmelt_runoff_onset

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.65.0
          manifest-path: global_snowmelt_runoff_onset_analysis/pixi.toml
          environments: ci
          cache: true

      - name: Write Earth Engine service key
        run: |
          printf '%s' "$EE_KEY" > global_snowmelt_runoff_onset/config/ee_key.json
        env:
          EE_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}

      - name: Fetch WY${{ matrix.year }}
        working-directory: global_snowmelt_runoff_onset_analysis
        run: |
          pixi run -e ci python pipeline/scripts/fetch_era5.py \
            --config "${{ inputs.config_file }}" \
            --water-years "${{ matrix.year }}" \
            --copy-from-version "${{ inputs.copy_from_version }}"

  anomaly:
    # all year stores verified complete (skip-if-marked) -> build the anomaly
    # store on a 16 GB runner; dask's median OOMs the dev box
    needs: fetch
    if: ${{ inputs.build_anomaly }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MALLOC_ARENA_MAX: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: global_snowmelt_runoff_onset_analysis

      - name: Checkout production repo (side-by-side, required by the pixi env and Config; pinned commit)
        uses: actions/checkout@v4
        with:
          repository: egagli/global_snowmelt_runoff_onset
          ref: ${{ env.PRODUCTION_REPO_SHA }}
          path: global_snowmelt_runoff_onset

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.65.0
          manifest-path: global_snowmelt_runoff_onset_analysis/pixi.toml
          environments: ci
          cache: true

      - name: Write Earth Engine service key
        run: |
          printf '%s' "$EE_KEY" > global_snowmelt_runoff_onset/config/ee_key.json
        env:
          EE_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}

      - name: Build anomaly store
        working-directory: global_snowmelt_runoff_onset_analysis
        run: |
          pixi run -e ci python pipeline/scripts/fetch_era5.py \
            --config "${{ inputs.config_file }}" --build-anomaly
