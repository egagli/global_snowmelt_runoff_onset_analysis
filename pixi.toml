[workspace]
name = "global-snowmelt-runoff-onset-analysis"
version = "0.1.0"
description = "Analyses of the global snowmelt runoff onset dataset: map/reduce aggregation pipeline and notebooks"
authors = ["Eric Gagliano <egagli@uw.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# Two features: `pipeline` is everything the fleet worker, the ERA5 acquisition and the local
# reduce need (the `ci` environment the GitHub Actions jobs install); `analysis` adds the
# plotting/statistics stack of the notebooks. The default environment has both plus jupyter.

[dependencies]
python = ">=3.12"

[feature.pipeline.dependencies]
# core
numpy = "*"
pandas = "*"
xarray = "*"
scipy = "*"
dask = "*"
pyarrow = "*"
bottleneck = "*"
flox = "*"
tqdm = "*"
requests = "*"
# IO / formats
zarr = "*"
netcdf4 = "*"
h5netcdf = "*"
fsspec = "*"
cftime = "*"
pooch = "*"
icechunk = ">=2,<3"
obstore = ">=0.11.1,<0.12"
# geospatial
geopandas = "*"
shapely = "*"
pyproj = "*"
rasterio = "*"
rioxarray = "*"
odc-stac = ">=0.4"
odc-geo = "*"
geocube = "*"
xdem = "*"
# data access / cloud
adlfs = "*"
azure-storage-blob = "*"
planetary-computer = "*"
pystac = "*"
pystac-client = "*"
earthengine-api = "*"
# xee >= 0.1 takes an explicit pixel grid (crs, crs_transform, shape_2d) instead of geometry=/projection=,
# so requests land exactly on a source's native lattice. easysnowdata 0.0.25 (PyPI only, 2026) follows it;
# <= 0.0.24 anchored the xee grid on the bbox corner, half a pixel off the CHILI lattice (measured
# 2026-09-03 on tile 016_152: a nearest-neighbour resample of a grid shifted 0.46/0.51 px), which is why
# the v9-era CHILI layers differ from the native values. The v10 fleet builds CHILI on the native grid.
xee = ">=0.1.2,<0.2"

[feature.pipeline.pypi-dependencies]
easysnowdata = ">=0.0.25"

[feature.analysis.dependencies]
matplotlib = "*"
seaborn = ">=0.13.2,<0.14"
cartopy = ">=0.25.0,<0.26"
matplotlib-scalebar = ">=0.9.0,<0.10"
contextily = "*"
mapclassify = "*"
xyzservices = "*"
statsmodels = "*"
scikit-learn = "*"
pymannkendall = "*"
libpysal = ">=4.15.0,<5"
pillow = "*"

[feature.dev.dependencies]
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"
nbconvert = "*"
nbstripout = ">=0.9.1,<0.10"

[pypi-dependencies]
# the production package, installed editable from the SIDE-BY-SIDE clone (see README: Setup).
# That repository is read-only from here; the workflows and CI check it out at the commit
#   18992fa7018d517a23f5507b28ec80edba2d0482   (main on 2026-09-01)
# — keep this comment and the PRODUCTION_REPO_SHA env in .github/workflows/*.yml in step.
global-snowmelt-runoff-onset = { path = "../global_snowmelt_runoff_onset", editable = true }
gsro-analysis = { path = ".", editable = true }

# `notebooks` is what the CI needs to execute the three aggregation notebooks headlessly
# (nbconvert + a kernel + matplotlib for their preview plots); the fleet jobs share the env.
[feature.notebooks.dependencies]
nbconvert = ">=7.17.1,<8"
ipykernel = ">=7.3.0,<8"
matplotlib = ">=3.11.1,<4"

[environments]
default = { features = ["pipeline", "analysis", "dev", "notebooks"] }
# slim env for the GitHub Actions jobs (fleet, ERA5 acquire, CI aggregation): no cartopy, no jupyterlab
ci = { features = ["pipeline", "notebooks"] }

[tasks]
lab = "jupyter lab"
setup-kernel = "python -m ipykernel install --user --name gsro-analysis --display-name 'gsro-analysis (pixi)'"
# the git filter that strips notebook outputs AND the kernelspec (so a kernel rename never dirties a notebook)
setup-nbstripout = "nbstripout --install --attributes .gitattributes && git config filter.nbstripout.extrakeys 'metadata.kernelspec metadata.language_info'"
# the aggregation step, headless: the three notebooks in order (executed copies land in scratch/executed/).
# Extra arguments follow a task name directly (pixi 0.65 passes a `--` separator through, which argparse rejects).
aggregate = "jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=7200 --ExecutePreprocessor.kernel_name=python3 --output-dir scratch/executed analyses/continents/0_aggregate_by_continent.ipynb analyses/mountain_ranges/0_aggregate_by_mountain_range.ipynb analyses/river_basins/0_aggregate_by_river_basin.ipynb"
# one-off static inputs
hillshade = "python pipeline/scripts/get_hillshade.py"                # Natural Earth -> World Robinson 1 km COG (no credentials)
population = "python pipeline/scripts/get_basin_population.py"       # GPW population per HydroBASINS level-6 basin (Earth Engine) -> tracked CSV
gtopo30 = "python pipeline/scripts/get_gtopo30_histogram.py"         # GTOPO30 land histogram (Earth Engine) -> tracked netCDF
